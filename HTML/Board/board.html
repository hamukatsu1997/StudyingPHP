<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>データ管理掲示板</title>

    <link
        rel="stylesheet"
        href="../../CSS/Board/board.css"
    >
</head>

<body>

<main class="board-container">

    <header class="board-header">
        <div>
            <h1>データ管理掲示板</h1>

            <p>
                連絡事項やデータ管理に関するメモを共有できます。
            </p>
        </div>

        <a
            class="back-link"
            href="../../PHP/Top/topController.php"
        >
            Topへ戻る
        </a>
    </header>


    <section class="post-form-section">

        <h2>新規投稿</h2>

        <?php if ($error !== ''): ?>
            <p class="error-message">
                <?= htmlspecialchars(
                    $error,
                    ENT_QUOTES,
                    'UTF-8'
                ) ?>
            </p>
        <?php endif; ?>

        <form
            method="post"
            action="../../PHP/Board/board.php"
        >
            <label for="body">
                投稿内容
            </label>

            <textarea
                id="body"
                name="body"
                maxlength="1000"
                required
                placeholder="投稿内容を入力してください"
            ></textarea>

            <button type="submit">
                投稿する
            </button>
        </form>

    </section>


    <section class="post-list-section">

        <h2>投稿一覧</h2>

        <?php if (empty($messages)): ?>

            <p class="empty-message">
                まだ投稿はありません。
            </p>

        <?php else: ?>

            <div class="post-list">

                <?php foreach ($messages as $message): ?>

                    <article class="post-card">

                        <div class="post-meta">

                            <strong>
                                <?= htmlspecialchars(
                                    $message['user_name']
                                    ?: $message['user_id'],
                                    ENT_QUOTES,
                                    'UTF-8'
                                ) ?>
                            </strong>

                            <time
                                datetime="<?= htmlspecialchars(
                                    $message['posted_at'],
                                    ENT_QUOTES,
                                    'UTF-8'
                                ) ?>"
                            >
                                <?= htmlspecialchars(
                                    $message['posted_at'],
                                    ENT_QUOTES,
                                    'UTF-8'
                                ) ?>
                            </time>

                        </div>

                        <p class="post-body">
                            <?= nl2br(
                                htmlspecialchars(
                                    $message['body'],
                                    ENT_QUOTES,
                                    'UTF-8'
                                )
                            ) ?>
                        </p>

                    </article>

                <?php endforeach; ?>

            </div>

        <?php endif; ?>

    </section>

</main>

</body>
</html>
