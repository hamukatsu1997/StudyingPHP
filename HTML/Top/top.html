<script src="../../JS/Top/top.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const secretCommand = [
        'ArrowUp',
        'ArrowUp',
        'ArrowDown',
        'ArrowDown',
        'ArrowLeft',
        'ArrowRight',
        'ArrowLeft',
        'ArrowRight',
        'b',
        'a'
    ];

    const secretMenu = document.getElementById('secretMenu');
    let commandPosition = 0;

    if (!secretMenu) {
        console.error('secretMenuが見つかりません');
        return;
    }

    document.addEventListener('keydown', function (event) {
        const inputKey = event.key.length === 1
            ? event.key.toLowerCase()
            : event.key;

        if (inputKey === secretCommand[commandPosition]) {
            commandPosition++;

            if (commandPosition === secretCommand.length) {
                secretMenu.style.display = 'block';
                secretMenu.setAttribute('aria-hidden', 'false');

                secretMenu.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });

                commandPosition = 0;
            }
        } else {
            commandPosition =
                inputKey === secretCommand[0] ? 1 : 0;
        }
    });
});
</script>
