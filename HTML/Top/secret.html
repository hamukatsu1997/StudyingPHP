<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Special Menu</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(
                135deg,
                #17122b,
                #341c4d
            );
            color: #ffffff;
            font-family: system-ui, sans-serif;
        }

        .card {
            width: min(90%, 620px);
            padding: 42px 28px;
            text-align: center;
            border: 1px solid #d8b4fe;
            border-radius: 20px;
            background: #ffffff12;
            box-shadow: 0 20px 60px #0006;
        }

        .icon {
            font-size: 4rem;
        }

        h1 {
            margin: 12px 0;
        }

        p {
            color: #e9d5ff;
        }

        .back {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 18px;
            border-radius: 8px;
            color: #2e1065;
            background: #e9d5ff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="icon">✨</div>

        <h1>Special Menu</h1>

        <p>
            隠しコマンドが認証されました。
        </p>

        <p>
            ここはピアノとは別に用意した特別ページです。
        </p>

        <a
            class="back"
            href="../../PHP/Top/topController.php"
        >
            Topへ戻る
        </a>
    </main>
</body>
</html>
